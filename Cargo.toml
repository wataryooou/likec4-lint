[workspace]
resolver = "2"
members = [
  "crates/likec4-syntax",
  "crates/likec4-fmt",
  "crates/likec4-lint",
  "crates/likec4-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/wataryooou/likec4-lint"
authors = ["wataryooou"]

[workspace.dependencies]
likec4-syntax = { path = "crates/likec4-syntax" }
likec4-fmt = { path = "crates/likec4-fmt" }
likec4-lint = { path = "crates/likec4-lint" }
rowan = "0.17"
text-size = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
rayon = "1"
regex = "1"
similar = "3"
annotate-snippets = "0.12"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
